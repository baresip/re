name: Windows

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows Debug",
            os: windows-2022,
            environment_script: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat",
            generators: "Ninja",
            build: "Debug",
            openssl: true,
            disable_openssl: "OFF",
            testing: true,
            c11_threads: "ON"
          }
        - {
            name: "Windows Release",
            os: windows-2022,
            environment_script: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat",
            generators: "Ninja",
            build: "Release",
            openssl: true,
            disable_openssl: "OFF",
            testing: true,
            c11_threads: "ON"
          }
        - {
            name: "Windows Debug ARM64",
            os: windows-2022,
            environment_script: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvarsamd64_arm64.bat",
            generators: "Ninja",
            build: "Debug",
            openssl: false,
            disable_openssl: "ON",
            testing: false,
            c11_threads: "ON"
          }

    steps:
      - uses: actions/checkout@v7

      - name: Download pre-compiled OpenSSL
        if: ${{ matrix.config.openssl }}
        shell: bash
        run: |
          curl -fsSL -o openssl.zip "https://github.com/baresip/tools/releases/download/v2026.10.0/openssl-windows-x64.zip"
          7z x openssl.zip
          echo "OPENSSL_ROOT_DIR=$GITHUB_WORKSPACE\\openssl-windows-x64" >> $GITHUB_ENV

      - name: Build
        shell: cmd
        run: |
          call "${{ matrix.config.environment_script }}"
          cmake --version
          ninja --version
          cmake -S . -B build -G "${{ matrix.config.generators }}" -DCMAKE_C_FLAGS="/WX" -DHAVE_THREADS="${{ matrix.c11_threads }}" -DCMAKE_BUILD_TYPE="${{ matrix.config.build }}" -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL="${{ matrix.config.disable_openssl }}" -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build build --parallel -t retest

      - name: retest
        if: ${{ matrix.config.testing }}
        shell: cmd
        run: |
          build\test\retest.exe -a -v
